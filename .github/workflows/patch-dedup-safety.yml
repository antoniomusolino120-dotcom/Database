name: Patch Production Dedup Safety

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-dedup-safety.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Apps Script patch
        run: python3 .hotfix/patch_dedup_safety.py

      - name: Syntax check production Apps Script
        run: |
          cp apps-script/Code.gs /tmp/database-code.js
          node --check /tmp/database-code.js

      - name: Run dedup safety tests against production policy
        run: node --test cloud/dedup.test.mjs cloud/apps-script-dedup.test.mjs

      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/Code.gs
          git diff --cached --quiet && { echo 'No Apps Script changes to commit'; exit 0; }
          git commit -m 'Harden production dedup against false-positive lead merges'
          git push origin HEAD:main
