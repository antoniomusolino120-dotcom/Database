name: Database Cloud Resilient Watchdog

on:
  workflow_run:
    workflows: ['Database Cloud Scraper']
    types: [in_progress]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run cloud da monitorare'
        required: true
        type: string
  push:
    paths:
      - '.recovery/cloud-watchdog-34752297332'

permissions:
  contents: read

concurrency:
  group: database-cloud-watchdog-${{ github.event.workflow_run.id || inputs.run_id || '34752297332' }}
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      SHEET_ENDPOINT: ${{ secrets.SHEET_ENDPOINT }}
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id || '34752297332' }}
      MAX_GENERATION: '6'
    steps:
      - name: Keep failed workers alive until run deadline
        shell: bash
        run: |
          set -u
          test -n "$SHEET_ENDPOINT" || (echo 'Missing repository secret SHEET_ENDPOINT' && exit 1)
          echo '{}' > /tmp/watchdog-preview-times.json
          echo '0' > /tmp/watchdog-terminal-count
          echo '0' > /tmp/watchdog-mismatch-count

          while true; do
            state_payload=$(python3 - <<'PY'
          import json
          try:
              times=json.load(open('/tmp/watchdog-preview-times.json'))
          except Exception:
              times={}
          print(json.dumps({'action':'getCloudDashboardState','previewTimes':times}))
          PY
            )

            curl --silent --show-error --location --connect-timeout 15 --max-time 45 \
              -H 'Content-Type: text/plain;charset=utf-8' \
              --data-binary "$state_payload" \
              "$SHEET_ENDPOINT" > /tmp/watchdog-state.json 2>watchdog-state.err || true

            decision=$(python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone

          def bump(path):
              try:
                  n=int(open(path).read().strip() or '0')+1
              except Exception:
                  n=1
              open(path,'w').write(str(n))
              return n

          def reset(path):
              open(path,'w').write('0')

          try:
              data=json.load(open('/tmp/watchdog-state.json'))
          except Exception:
              print('RETRY')
              raise SystemExit

          if data.get('ok') is not True:
              print('RETRY')
              raise SystemExit

          times={}
          for worker in data.get('workers') or []:
              idx=worker.get('workerIndex')
              at=worker.get('previewAt')
              if idx is not None and at:
                  times[str(idx)]=str(at)
          try:
              json.dump(times,open('/tmp/watchdog-preview-times.json','w'))
          except Exception:
              pass

          run=data.get('run') or {}
          target=os.environ['RUN_ID']
          current=str(run.get('runId',''))

          if current != target:
              reset('/tmp/watchdog-terminal-count')
              n=bump('/tmp/watchdog-mismatch-count')
              print('STOP' if n >= 3 else 'RETRY')
              raise SystemExit
          reset('/tmp/watchdog-mismatch-count')

          deadline=str(run.get('deadlineAt') or '').strip()
          if deadline:
              try:
                  when=datetime.fromisoformat(deadline.replace('Z','+00:00'))
                  if datetime.now(timezone.utc) >= when:
                      print('STOP')
                      raise SystemExit
              except ValueError:
                  pass

          control=str(run.get('control','')).upper()
          if control in {'STOP','PAUSE'} or bool(run.get('stopRequested')):
              print('STOP')
              raise SystemExit

          status=str(run.get('status','')).upper()
          if status != 'RUNNING':
              n=bump('/tmp/watchdog-terminal-count')
              print('STOP' if n >= 3 else 'RETRY')
              raise SystemExit
          reset('/tmp/watchdog-terminal-count')

          max_generation=max(2,int(os.environ.get('MAX_GENERATION','6') or 6))
          failed=[]
          exhausted=[]
          for worker in data.get('workers') or []:
              if str(worker.get('runId','')) != target:
                  continue
              worker_status=str(worker.get('status','')).upper()
              phase=str(worker.get('phase','')).upper()
              generation=max(1,int(worker.get('generation') or 1))
              is_failed=(
                  worker_status == 'STALLED'
                  or (worker_status == 'DONE' and ('ERRORE' in phase or 'ERROR' in phase))
                  or (worker_status == 'READY' and ('FALLITO' in phase or 'FAILED' in phase))
              )
              if not is_failed:
                  continue
              try:
                  idx=int(worker.get('workerIndex'))
              except Exception:
                  continue
              if idx < 0:
                  continue
              if generation >= max_generation:
                  exhausted.append(idx)
              else:
                  failed.append(idx)

          if exhausted:
              print('EXHAUSTED:' + ','.join(str(i) for i in sorted(set(exhausted))))
          elif failed:
              print('RESTART:' + ','.join(str(i) for i in sorted(set(failed))))
          else:
              print('NONE')
          PY
            )

            if [ "$decision" = 'STOP' ]; then
              echo 'Watchdog terminato: run chiuso, sostituito, fermato o deadline raggiunta.'
              exit 0
            fi

            if [ "$decision" = 'RETRY' ]; then
              echo 'Watchdog: stato transitorio, richiedo conferma prima di terminare.'
              sleep 60
              continue
            fi

            if [[ "$decision" == EXHAUSTED:* ]]; then
              echo "Watchdog: limite di 5 rilanci raggiunto per worker ${decision#EXHAUSTED:}; non creo loop infiniti."
              sleep 60
              continue
            fi

            if [[ "$decision" == RESTART:* ]]; then
              IFS=',' read -r -a failed <<< "${decision#RESTART:}"
              for worker_index in "${failed[@]}"; do
                restart_payload=$(WORKER_INDEX="$worker_index" python3 - <<'PY'
          import json, os
          print(json.dumps({'action':'restartCloudWorker','workerIndex':int(os.environ['WORKER_INDEX'])}))
          PY
                )

                curl --silent --show-error --location --connect-timeout 15 --max-time 75 \
                  -H 'Content-Type: text/plain;charset=utf-8' \
                  --data-binary "$restart_payload" \
                  "$SHEET_ENDPOINT" > /tmp/watchdog-restart.json 2>watchdog-restart.err || true

                WORKER_INDEX="$worker_index" python3 - <<'PY'
          import json, os
          idx=int(os.environ['WORKER_INDEX'])+1
          try:
              data=json.load(open('/tmp/watchdog-restart.json'))
          except Exception:
              print(f'Worker {idx}: risposta di rilancio non leggibile; ricontrollerò lo stato.')
              raise SystemExit
          if data.get('ok') is True:
              generation=data.get('generation')
              print(f'Worker {idx}: rilancio automatico richiesto, generation {generation}.')
          else:
              print(f'Worker {idx}: rilancio non accettato: {data.get("error","errore sconosciuto")}')
          PY
              done
            fi

            sleep 60
          done
