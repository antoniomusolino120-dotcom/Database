name: Patch final cloud console

on:
  push:
    branches: [collector-shared-queue-cloud]
    paths:
      - '.github/workflows/patch-cloud-console.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: collector-shared-queue-cloud
          fetch-depth: 0

      - name: Patch Apps Script backend
        shell: python
        run: |
          from pathlib import Path
          p=Path('apps-script/Code.gs')
          s=p.read_text()

          anchor="const CLOUD_DEFAULT_LEASE_SECONDS = 900;\n"
          addition="""const CLOUD_DEFAULT_LEASE_SECONDS = 900;
          const CLOUD_PENDING_START_KEY = 'CLOUD_PENDING_START';
          const GITHUB_OWNER = 'antoniomusolino120-dotcom';
          const GITHUB_REPO = 'Database';
          const GITHUB_WORKFLOW = 'cloud-collector.yml';
          const GITHUB_REF = 'main';
          """
          if 'const GITHUB_WORKFLOW' not in s:
              assert anchor in s
              s=s.replace(anchor,addition,1)

          old="const patch={};patch[CLOUD_RUN_KEY]=state;"
          new="const patch={};patch[CLOUD_RUN_KEY]=state;patch[CLOUD_PENDING_START_KEY]='';"
          if old in s:
              s=s.replace(old,new,1)

          old="const summary={run,workers,totals:run.totals||computeCloudTotals_(),generatedAt:nowIso_()};"
          new="const pendingStart=getJobStateValue_(CLOUD_PENDING_START_KEY);const summary={run,workers,totals:run.totals||computeCloudTotals_(),pendingStart,console:{githubConfigured:Boolean(githubToken_())},generatedAt:nowIso_()};"
          if old in s:
              s=s.replace(old,new,1)

          old="run.status=run.stopRequested?'STOPPED':(errors?'COMPLETED_WITH_ERRORS':'COMPLETED');"
          if old in s:
              s=s.replace(old,"run.status=run.stopRequested?'STOPPED':'WORKERS_DONE';",1)

          marker='function doGet(e){\n'
          if 'function startCloudCollector(' not in s:
              assert marker in s
              funcs=r'''function githubToken_(){
            return String(PropertiesService.getScriptProperties().getProperty('GITHUB_TOKEN')||'').trim();
          }

          function githubDispatch_(workerCount,maxMunicipalitiesPerWorker,maxMinutes){
            const token=githubToken_();
            if(!token)throw new Error('GITHUB_TOKEN non configurato nelle Proprietà script');
            const url='https://api.github.com/repos/'+encodeURIComponent(GITHUB_OWNER)+'/'+encodeURIComponent(GITHUB_REPO)+'/actions/workflows/'+encodeURIComponent(GITHUB_WORKFLOW)+'/dispatches';
            const payload={
              ref:GITHUB_REF,
              inputs:{
                workers:String(workerCount),
                max_minutes:String(maxMinutes),
                max_municipalities_per_worker:String(maxMunicipalitiesPerWorker)
              }
            };
            const res=UrlFetchApp.fetch(url,{
              method:'post',
              contentType:'application/json',
              headers:{
                Authorization:'Bearer '+token,
                Accept:'application/vnd.github+json',
                'X-GitHub-Api-Version':'2022-11-28'
              },
              payload:JSON.stringify(payload),
              muteHttpExceptions:true
            });
            const code=res.getResponseCode();
            const body=String(res.getContentText()||'');
            if(code<200||code>=300)throw new Error('GitHub workflow dispatch HTTP '+code+(body?' · '+body.slice(0,350):''));
            let parsed={};
            if(body){try{parsed=JSON.parse(body);}catch{parsed={};}}
            return {statusCode:code,workflowRunId:parsed.workflow_run_id||null,workflowRunUrl:parsed.html_url||null};
          }

          function startCloudCollector(workerCount,maxMunicipalitiesPerWorker,maxMinutes){
            workerCount=Number(workerCount);
            maxMunicipalitiesPerWorker=Math.max(0,Math.min(10000,Number(maxMunicipalitiesPerWorker)||0));
            maxMinutes=Math.max(5,Math.min(330,Number(maxMinutes)||300));
            if(![3,5].includes(workerCount))throw new Error('Scegli 3 o 5 Chromium');
            if(!githubToken_())throw new Error('GITHUB_TOKEN non configurato nelle Proprietà script');

            const lock=LockService.getScriptLock();
            lock.waitLock(10000);
            let pending;
            try{
              const run=getJobStateValue_(CLOUD_RUN_KEY);
              if(run&&['RUNNING','STOPPING','WORKERS_DONE'].includes(String(run.status||''))){
                throw new Error('Esiste già un run attivo: '+String(run.status||''));
              }
              const currentPending=getJobStateValue_(CLOUD_PENDING_START_KEY);
              if(currentPending&&currentPending.requestedAt){
                const age=Date.now()-(Date.parse(currentPending.requestedAt)||0);
                if(age>=0&&age<90000)throw new Error('Avvio già richiesto, attendi che GitHub prepari i worker');
              }
              pending={requestedAt:nowIso_(),workerCount,maxMunicipalitiesPerWorker,maxMinutes};
              const patch={};patch[CLOUD_PENDING_START_KEY]=pending;setJobState_(patch);clearDashboardCache_();
            }finally{lock.releaseLock();}

            try{
              const dispatched=githubDispatch_(workerCount,maxMunicipalitiesPerWorker,maxMinutes);
              return {ok:true,pendingStart:pending,...dispatched};
            }catch(err){
              const patch={};patch[CLOUD_PENDING_START_KEY]='';setJobState_(patch);clearDashboardCache_();
              throw err;
            }
          }

          '''
              s=s.replace(marker,funcs+marker,1)

          p.write_text(s)

      - name: Patch cloud worker smoke limit
        shell: python
        run: |
          from pathlib import Path
          p=Path('cloud/worker.mjs')
          s=p.read_text()
          anchor="const LEASE_SECONDS=Math.max(300,Math.min(1800,Number(process.env.LEASE_SECONDS||900)));\n"
          if 'MAX_MUNICIPALITIES_PER_WORKER' not in s:
              assert anchor in s
              s=s.replace(anchor,anchor+"const MAX_MUNICIPALITIES_PER_WORKER=Math.max(0,Math.min(10000,Number(process.env.MAX_MUNICIPALITIES_PER_WORKER||0)));\n",1)
          s=s.replace("let lastHeartbeat=0,lastPreview=0,stopRequested=false;","let lastHeartbeat=0,lastPreview=0,stopRequested=false,completedByWorker=0;",1)
          s=s.replace("while(Date.now()<deadline&&!stopRequested){","while(Date.now()<deadline&&!stopRequested&&(MAX_MUNICIPALITIES_PER_WORKER===0||completedByWorker<MAX_MUNICIPALITIES_PER_WORKER)){",1)
          needle="        municipalitiesSinceRefresh++;\n"
          if "completedByWorker++;" not in s:
              assert needle in s
              s=s.replace(needle,needle+"        completedByWorker++;\n",1)
          s=s.replace("log('worker-done',{municipalities:state.municipalities.length,errors:state.errors.length,stopped:stopRequested});","log('worker-done',{municipalities:state.municipalities.length,completedByWorker,limit:MAX_MUNICIPALITIES_PER_WORKER,errors:state.errors.length,stopped:stopRequested});",1)
          p.write_text(s)

      - name: Patch cloud workflow inputs
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/cloud-collector.yml')
          s=p.read_text()
          s=s.replace('name: FindMyInk Cloud Collector','name: Database Cloud Scraper',1)
          if 'max_municipalities_per_worker:' not in s:
              anchor="""      max_minutes:
                  description: 'Durata massima per worker (max 330)'
                  required: true
                  default: '300'
                  type: string
          """
              # Account for exact indentation in existing YAML
              exact="""      max_minutes:
                description: 'Durata massima per worker (max 330)'
                required: true
                default: '300'
                type: string
          """
              add=exact+"""      max_municipalities_per_worker:
                description: '0 = coda completa, 1 = smoke test'
                required: true
                default: '0'
                type: string
          """
              assert exact in s
              s=s.replace(exact,add,1)
          env_anchor="      MAX_MINUTES: ${{ inputs.max_minutes }}\n"
          if 'MAX_MUNICIPALITIES_PER_WORKER:' not in s:
              assert env_anchor in s
              s=s.replace(env_anchor,env_anchor+"      MAX_MUNICIPALITIES_PER_WORKER: ${{ inputs.max_municipalities_per_worker }}\n",1)
          p.write_text(s)

      - name: Make validation watch dashboard too
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/validate-cloud.yml')
          s=p.read_text()
          if "      - 'apps-script/dashboard.html'" not in s:
              s=s.replace("      - 'apps-script/Code.gs'\n","      - 'apps-script/Code.gs'\n      - 'apps-script/dashboard.html'\n",1)
          p.write_text(s)

      - name: Write final dashboard
        shell: bash
        run: |
          cat > apps-script/dashboard.html <<'HTML'
          <!doctype html>
          <html lang="it">
          <head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Database Cloud Console</title>
          <style>
          :root{--bg:#0b0b0d;--panel:#141418;--panel2:#1a1a20;--line:#2b2b33;--text:#f5f5f6;--muted:#9797a3;--orange:#ff5000;--green:#34c759;--yellow:#ffcc00;--red:#ff453a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1440px;margin:0 auto;padding:24px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.dot{width:14px;height:14px;border-radius:50%;background:var(--orange);box-shadow:0 0 20px rgba(255,80,0,.55)}h1{font-size:22px;margin:0}.sub,.muted{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer;font-size:13px}.btn:hover:not(:disabled){filter:brightness(1.13)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.primary{background:var(--orange);border-color:var(--orange);color:white;min-width:120px}.btn.danger{border-color:#5a2020;color:#ff8d86}.controls{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:end;gap:18px;flex-wrap:wrap;margin-bottom:12px}.control-group{display:grid;gap:7px}.label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800}.segments{display:flex;gap:6px}.seg{border:1px solid var(--line);background:#101014;color:#c8c8d0;padding:9px 11px;border-radius:9px;font-size:12px;font-weight:800;cursor:pointer}.seg.active{border-color:var(--orange);color:white;background:rgba(255,80,0,.15)}.launch-state{margin-left:auto;min-width:250px}.launch-state b{display:block;font-size:12px}.token-ok{color:#75e18e}.token-bad{color:#ff8c86}.statusline{font-size:12px;color:var(--muted);margin:8px 0 12px}.summary{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:10px;margin-bottom:14px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.metric b{display:block;font-size:22px;margin-top:5px}.metric span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.progress{height:8px;background:#222229;border-radius:99px;overflow:hidden;margin:8px 0 18px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--orange),#ff8a4c);transition:width .4s}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.worker{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}.worker.off{opacity:.48}.worker-head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:1px solid var(--line)}.worker-title{font-weight:800}.badge{font-size:10px;font-weight:900;padding:5px 8px;border-radius:999px;background:#2a2a31;color:#cfcfd6}.badge.WORKING{background:rgba(52,199,89,.13);color:#75e18e}.badge.IDLE,.badge.QUEUED{background:rgba(255,204,0,.12);color:#ffe166}.badge.DONE{background:rgba(151,151,163,.16);color:#d1d1d7}.preview{aspect-ratio:16/9;background:#09090b;display:grid;place-items:center;position:relative;overflow:hidden}.preview img{width:100%;height:100%;object-fit:cover;display:block}.placeholder{color:#54545f;font-size:12px}.preview-meta{position:absolute;right:8px;bottom:8px;display:flex;gap:5px}.preview-time,.preview-countdown{background:rgba(0,0,0,.78);padding:4px 6px;border-radius:6px;font-size:10px;color:#ddd}.preview-countdown.ok{color:#9af0ad}.preview-countdown.late{color:#ffd45e}.preview-countdown.stale{color:#ff938d}.body{padding:13px 14px}.municipality{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.phase{font-size:12px;color:var(--orange);font-weight:800;margin-top:4px}.query{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:17px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.s{padding:8px;border:1px solid var(--line);border-radius:9px;background:#111115}.s span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.s b{font-size:13px}.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:10px}.log{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.log h2{font-size:13px;margin:0 0 10px}.rows{display:grid;gap:7px}.row{display:grid;grid-template-columns:70px 85px 1fr;gap:8px;font-size:11px;padding:7px 8px;background:#101014;border-radius:8px}.row .time,.row .who{color:var(--muted)}.error{color:#ff938d}@media(max-width:1100px){.summary{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.wrap{padding:14px}.top{align-items:flex-start;flex-direction:column}.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.controls{align-items:stretch}.launch-state{margin-left:0;min-width:100%}.segments{flex-wrap:wrap}.btn.primary{flex:1}.row{grid-template-columns:60px 75px 1fr}}
          </style></head>
          <body><div class="wrap">
          <div class="top"><div class="brand"><div class="dot"></div><div><h1>Database Cloud Console</h1><div class="sub" id="runline">Nessun run attivo</div></div></div><button class="btn danger" id="stopBtn" onclick="stopRun()">STOP</button></div>
          <div class="controls">
            <div class="control-group"><div class="label">Chromium</div><div class="segments"><button class="seg active" id="w3" onclick="setWorkers(3)">3 worker</button><button class="seg" id="w5" onclick="setWorkers(5)">5 worker</button></div></div>
            <div class="control-group"><div class="label">Modalità</div><div class="segments"><button class="seg active" id="modeTest" onclick="setMode('test')">TEST · 1 comune / worker</button><button class="seg" id="modeFull" onclick="setMode('full')">COMPLETA · tutta la coda</button></div></div>
            <button class="btn primary" id="startBtn" onclick="startRun()">AVVIA</button>
            <div class="launch-state"><b id="tokenState">Controllo token GitHub…</b><span class="muted" id="launchState">La console avvia direttamente GitHub Actions.</span></div>
          </div>
          <div class="statusline" id="statusline">Connessione al Google Sheet…</div>
          <div class="summary"><div class="metric"><span>Completati</span><b id="m-completed">—</b></div><div class="metric"><span>TODO</span><b id="m-todo">—</b></div><div class="metric"><span>Trovati</span><b id="m-found">—</b></div><div class="metric"><span>Nuovi</span><b id="m-new">—</b></div><div class="metric"><span>Duplicati</span><b id="m-dupes">—</b></div><div class="metric"><span>Scartati</span><b id="m-foreign">—</b></div><div class="metric"><span>Errori</span><b id="m-errors">—</b></div></div>
          <div class="progress"><div id="bar"></div></div><div class="grid" id="workers"></div><div class="log"><h2>Attività worker</h2><div class="rows" id="activity"></div></div>
          </div>
          <script>
          const PREVIEW_SECONDS=25,previewTimes={},previewImages={};let lastWorkers=[],selectedWorkers=3,selectedMode='test',githubConfigured=false,currentRun={};
          function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
          function fmt(n){return Number(n||0).toLocaleString('it-IT')}
          function time(v){if(!v)return'—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
          function setWorkers(n){selectedWorkers=n;document.getElementById('w3').classList.toggle('active',n===3);document.getElementById('w5').classList.toggle('active',n===5)}
          function setMode(m){selectedMode=m;document.getElementById('modeTest').classList.toggle('active',m==='test');document.getElementById('modeFull').classList.toggle('active',m==='full')}
          function busy(run){return ['RUNNING','STOPPING','WORKERS_DONE'].includes(String(run&&run.status||''))}
          function countdownText(w){const i=Number(w.workerIndex||0),at=previewTimes[i];if(!at)return{text:'attendo screenshot',cls:'late'};if(String(w.status||'')!=='WORKING')return{text:'preview ferma',cls:'ok'};const age=Math.max(0,Math.floor((Date.now()-new Date(at).getTime())/1000)),remaining=PREVIEW_SECONDS-age;if(remaining>=0)return{text:`nuovo screenshot tra ${remaining}s`,cls:'ok'};const late=Math.abs(remaining);if(late<=20)return{text:`preview in ritardo +${late}s`,cls:'late'};return{text:`preview ferma +${late}s`,cls:'stale'};}
          function tickCountdowns(){for(const w of lastWorkers){const i=Number(w.workerIndex||0),el=document.getElementById('preview-countdown-'+i);if(!el)continue;const c=countdownText(w);el.textContent=c.text;el.className='preview-countdown '+c.cls;}}
          function render(data){const run=data.run||{},t=data.totals||{},workers=data.workers||[],pending=data.pendingStart||null;currentRun=run;lastWorkers=workers;githubConfigured=Boolean(data.console&&data.console.githubConfigured);document.getElementById('runline').textContent=run.runId?`Run ${run.runId} · ${run.workerCount||0} worker · ${run.status||'—'}`:'Nessun run attivo';document.getElementById('statusline').textContent=`Google Sheet collegato · ultimo aggiornamento ${time(data.generatedAt)} · refresh 5s`;const token=document.getElementById('tokenState');token.textContent=githubConfigured?'GitHub pronto':'GITHUB_TOKEN mancante';token.className=githubConfigured?'token-ok':'token-bad';const launch=document.getElementById('launchState');if(pending&&pending.requestedAt&&!busy(run))launch.textContent=`Avvio richiesto alle ${time(pending.requestedAt)} · ${pending.workerCount} worker`;else if(busy(run))launch.textContent=`Scraper ${run.status}`;else launch.textContent='Pronto per un nuovo avvio.';document.getElementById('startBtn').disabled=!githubConfigured||busy(run)||Boolean(pending&&pending.requestedAt&&!busy(run));document.getElementById('stopBtn').disabled=!busy(run);document.getElementById('m-completed').textContent=`${fmt(t.completed)} / ${fmt(t.total)}`;document.getElementById('m-todo').textContent=fmt(t.todo);document.getElementById('m-found').textContent=fmt(t.found);document.getElementById('m-new').textContent=fmt(t.newCount);document.getElementById('m-dupes').textContent=fmt(t.duplicates);document.getElementById('m-foreign').textContent=fmt(t.foreign);document.getElementById('m-errors').textContent=fmt(t.errors);document.getElementById('bar').style.width=(t.total?Math.min(100,(t.completed/t.total)*100):0)+'%';for(const w of workers){const i=Number(w.workerIndex||0);if(w.previewAt){previewTimes[i]=w.previewAt;if(w.previewBase64)previewImages[i]='data:image/jpeg;base64,'+w.previewBase64;}}document.getElementById('workers').innerHTML=workers.map(w=>{const i=Number(w.workerIndex||0),st=String(w.status||'OFFLINE'),active=i<Number(run.workerCount||0),img=previewImages[i]?`<img src="${previewImages[i]}" alt="Preview Chromium worker ${i+1}">`:`<div class="placeholder">Preview Chromium non ancora disponibile</div>`,c=countdownText(w);return`<section class="worker ${active?'':'off'}"><div class="worker-head"><div class="worker-title">Worker ${i+1}</div><span class="badge ${esc(st)}">${esc(st)}</span></div><div class="preview">${img}<div class="preview-meta"><span class="preview-time">${esc(time(w.previewAt))}</span><span id="preview-countdown-${i}" class="preview-countdown ${c.cls}">${esc(c.text)}</span></div></div><div class="body"><div class="municipality">${esc(w.municipalityName||'—')}</div><div class="phase">${esc(w.phase||st)}</div><div class="query">${esc(w.query||'')}</div><div class="stats"><div class="s"><span>Trovati</span><b>${fmt(w.found||0)}</b></div><div class="s"><span>Nuovi</span><b>${fmt(w.newCount||0)}</b></div><div class="s"><span>Dup.</span><b>${fmt(w.duplicates||0)}</b></div><div class="s"><span>Comuni</span><b>${fmt(w.completedMunicipalities||0)}</b></div></div><div class="foot"><span>${esc(w.queueCode||'')}</span><span>ping ${esc(time(w.lastSeen))}</span></div></div></section>`}).join('');const rows=workers.filter(w=>Number(w.workerIndex)<Number(run.workerCount||0)).map(w=>{const msg=w.lastError?`<span class="error">${esc(w.lastError)}</span>`:esc(`${w.phase||w.status||''}${w.municipalityName?' · '+w.municipalityName:''}${w.query?' · '+w.query:''}`);return`<div class="row"><span class="time">${esc(time(w.lastSeen))}</span><span class="who">Worker ${Number(w.workerIndex)+1}</span><span>${msg}</span></div>`});document.getElementById('activity').innerHTML=rows.join('')||'<div class="row"><span>—</span><span>—</span><span>Nessuna attività</span></div>';tickCountdowns();}
          function refresh(force=false){if(force)document.getElementById('statusline').textContent='Aggiornamento…';google.script.run.withSuccessHandler(render).withFailureHandler(err=>{document.getElementById('statusline').textContent='Errore dashboard: '+(err&&err.message?err.message:err)}).getCloudDashboardState(previewTimes)}
          function startRun(){const limit=selectedMode==='test'?1:0;if(!githubConfigured)return;const msg=selectedMode==='test'?`Avviare ${selectedWorkers} Chromium, 1 comune ciascuno?`:`Avviare ${selectedWorkers} Chromium sulla coda completa?`;if(!confirm(msg))return;const b=document.getElementById('startBtn');b.disabled=true;document.getElementById('launchState').textContent='Invio comando a GitHub…';google.script.run.withSuccessHandler(r=>{document.getElementById('launchState').textContent='Avvio accettato da GitHub. Attendo i worker…';setTimeout(()=>refresh(true),1800)}).withFailureHandler(err=>{b.disabled=false;document.getElementById('launchState').textContent='Errore avvio: '+(err&&err.message?err.message:err)}).startCloudCollector(selectedWorkers,limit,300)}
          function stopRun(){if(!confirm('Fermare il run? I worker termineranno in sicurezza appena possibile.'))return;document.getElementById('stopBtn').disabled=true;google.script.run.withSuccessHandler(()=>refresh(true)).withFailureHandler(err=>{alert(err&&err.message?err.message:err);refresh(true)}).requestCloudStop()}
          setWorkers(3);setMode('test');refresh(true);setInterval(()=>refresh(false),5000);setInterval(tickCountdowns,1000);
          </script></body></html>
          HTML

      - name: Commit final integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Code.gs apps-script/dashboard.html cloud/worker.mjs .github/workflows/cloud-collector.yml .github/workflows/validate-cloud.yml
          git commit -m "cloud: wire console launch and smoke mode" || exit 0
          git push origin HEAD:collector-shared-queue-cloud
