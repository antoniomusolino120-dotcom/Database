name: Database Cloud Continuity Scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: database-cloud-continuity-scheduler
  cancel-in-progress: true

jobs:
  ensure-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Recover latest stopped collector
        shell: bash
        run: |
          set -euo pipefail

          api_headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )

          curl --fail-with-body --silent --show-error --location \
            --connect-timeout 15 --max-time 45 \
            "${api_headers[@]}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cloud-collector.yml/runs?event=workflow_dispatch&per_page=20" \
            > /tmp/collector-runs.json

          decision=$(python3 - <<'PY'
          import json

          data=json.load(open('/tmp/collector-runs.json'))
          runs=data.get('workflow_runs') or []
          if not runs:
              print('NONE')
              raise SystemExit

          runs=sorted(runs, key=lambda r:int(r.get('id') or 0), reverse=True)
          active=[r for r in runs if str(r.get('status') or '').lower() != 'completed']
          if active:
              newest=max(active, key=lambda r:int(r.get('id') or 0))
              print(f"ACTIVE:{newest.get('id')}")
              raise SystemExit

          latest=runs[0]
          print(f"RECOVER:{latest.get('id')}")
          PY
          )

          case "$decision" in
            NONE)
              echo 'Nessun collector precedente da recuperare.'
              exit 0
              ;;
            ACTIVE:*)
              echo "Collector già attivo: ${decision#ACTIVE:}. Nessuna azione."
              exit 0
              ;;
            RECOVER:*)
              target_run_id="${decision#RECOVER:}"
              ;;
            *)
              echo "Decisione inattesa: $decision"
              exit 1
              ;;
          esac

          curl --fail-with-body --silent --show-error --location \
            --connect-timeout 15 --max-time 45 \
            "${api_headers[@]}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cloud-cycle-restart-resilient.yml/runs?per_page=20" \
            > /tmp/recovery-runs.json

          active_recovery=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/recovery-runs.json'))
          active=[r for r in (data.get('workflow_runs') or []) if str(r.get('status') or '').lower() != 'completed']
          print('true' if active else 'false')
          PY
          )
          if [ "$active_recovery" = 'true' ]; then
            echo 'Recovery resiliente già in esecuzione o in coda. Nessun doppio dispatch.'
            exit 0
          fi

          payload=$(TARGET_RUN_ID="$target_run_id" python3 - <<'PY'
          import json, os
          print(json.dumps({
              'ref':'main',
              'inputs':{'run_id':str(os.environ['TARGET_RUN_ID'])}
          }))
          PY
          )

          http_code=$(curl --silent --show-error --location \
            --connect-timeout 15 --max-time 45 \
            --output /tmp/recovery-dispatch.txt \
            --write-out '%{http_code}' \
            --request POST \
            "${api_headers[@]}" \
            --header 'Content-Type: application/json' \
            --data-binary "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cloud-cycle-restart-resilient.yml/dispatches")

          if [ "$http_code" != '204' ]; then
            echo "Dispatch recovery fallito: HTTP $http_code"
            cat /tmp/recovery-dispatch.txt || true
            exit 1
          fi

          echo "Recovery resiliente richiesto per collector $target_run_id."
