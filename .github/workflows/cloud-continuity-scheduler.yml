name: Database Cloud Continuity Scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloud-continuity-scheduler.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: database-cloud-continuity-scheduler
  cancel-in-progress: true

jobs:
  ensure-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      SHEET_ENDPOINT: ${{ secrets.SHEET_ENDPOINT }}
    steps:
      - name: Recover latest stopped collector
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SHEET_ENDPOINT" || (echo 'Missing repository secret SHEET_ENDPOINT' && exit 1)

          api_headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )

          curl --fail-with-body --silent --show-error --location \
            --connect-timeout 15 --max-time 45 \
            "${api_headers[@]}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cloud-collector.yml/runs?event=workflow_dispatch&per_page=20" \
            > /tmp/collector-runs.json

          collector=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/collector-runs.json'))
          runs=sorted(data.get('workflow_runs') or [], key=lambda r:int(r.get('id') or 0), reverse=True)
          if not runs:
              print('NONE')
              raise SystemExit
          active=[r for r in runs if str(r.get('status') or '').lower() != 'completed']
          if active:
              newest=max(active, key=lambda r:int(r.get('id') or 0))
              print(f"ACTIVE:{newest.get('id')}")
              raise SystemExit
          print(f"STOPPED:{runs[0].get('id')}")
          PY
          )

          case "$collector" in
            NONE)
              echo 'Nessun collector precedente da recuperare.'
              exit 0
              ;;
            ACTIVE:*)
              echo "Collector già attivo: ${collector#ACTIVE:}. Nessuna azione."
              exit 0
              ;;
            STOPPED:*)
              target_run_id="${collector#STOPPED:}"
              ;;
            *)
              echo "Decisione collector inattesa: $collector"
              exit 1
              ;;
          esac

          state_payload='{"action":"getCloudDashboardState","previewTimes":{}}'
          state_ok='false'
          for attempt in 1 2 3; do
            : > /tmp/continuity-state.json
            curl --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              -H 'Content-Type: text/plain;charset=utf-8' \
              --data-binary "$state_payload" \
              "$SHEET_ENDPOINT" > /tmp/continuity-state.json 2>/tmp/continuity-state.err || true

            if python3 - <<'PY'
          import json, sys
          try:
              data=json.load(open('/tmp/continuity-state.json'))
          except Exception:
              sys.exit(1)
          sys.exit(0 if data.get('ok') is True else 1)
          PY
            then
              state_ok='true'
              break
            fi
            echo "Bridge continuity check $attempt/3 non riuscito."
            test -s /tmp/continuity-state.err && cat /tmp/continuity-state.err || true
            sleep 10
          done

          if [ "$state_ok" != 'true' ]; then
            echo 'Stato centrale non verificabile: nessun dispatch cieco.'
            exit 1
          fi

          queue_decision=$(TARGET_RUN_ID="$target_run_id" python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/continuity-state.json'))
          run=data.get('run') or {}
          totals=data.get('totals') or run.get('totals') or {}
          current=str(run.get('runId') or '')
          target=str(os.environ['TARGET_RUN_ID'])
          status=str(run.get('status') or '').upper()
          control=str(run.get('control') or '').upper()
          stopped=bool(run.get('stopRequested'))
          todo=int(totals.get('todo') or 0)

          if current != target:
              print(f'NOOP:run corrente {current or "-"} diverso da {target}')
          elif control in {'STOP','PAUSE'} or stopped:
              print('NOOP:STOP/PAUSE richiesto')
          elif todo <= 0:
              print('NOOP:coda completata')
          elif status != 'INCOMPLETE':
              print(f'NOOP:stato {status or "-"}')
          else:
              print('RECOVER')
          PY
          )

          if [ "$queue_decision" != 'RECOVER' ]; then
            echo "${queue_decision#NOOP:}"
            exit 0
          fi

          curl --fail-with-body --silent --show-error --location \
            --connect-timeout 15 --max-time 45 \
            "${api_headers[@]}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cloud-cycle-restart-resilient.yml/runs?per_page=20" \
            > /tmp/recovery-runs.json

          active_recovery=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/recovery-runs.json'))
          active=[r for r in (data.get('workflow_runs') or []) if str(r.get('status') or '').lower() != 'completed']
          print('true' if active else 'false')
          PY
          )
          if [ "$active_recovery" = 'true' ]; then
            echo 'Recovery resiliente già in esecuzione o in coda. Nessun doppio dispatch.'
            exit 0
          fi

          payload=$(TARGET_RUN_ID="$target_run_id" python3 - <<'PY'
          import json, os
          print(json.dumps({
              'ref':'main',
              'inputs':{'run_id':str(os.environ['TARGET_RUN_ID'])}
          }))
          PY
          )

          http_code=$(curl --silent --show-error --location \
            --connect-timeout 15 --max-time 45 \
            --output /tmp/recovery-dispatch.txt \
            --write-out '%{http_code}' \
            --request POST \
            "${api_headers[@]}" \
            --header 'Content-Type: application/json' \
            --data-binary "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cloud-cycle-restart-resilient.yml/dispatches")

          if [ "$http_code" != '204' ]; then
            echo "Dispatch recovery fallito: HTTP $http_code"
            cat /tmp/recovery-dispatch.txt || true
            exit 1
          fi

          echo "Recovery resiliente richiesto per collector $target_run_id."
