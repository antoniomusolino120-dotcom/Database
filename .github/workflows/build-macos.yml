name: Build FindMyInk Collector macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.hotfix/**'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified V3 base
        shell: bash
        run: |
          BASE_COMMIT="edc8c985e9e2f6e9bc205e24889ff2169dd696cd"
          git fetch --depth=1 origin "$BASE_COMMIT"
          mkdir -p /tmp/fmi-v3-parts
          for n in 00 01 02 03 04; do
            git show "$BASE_COMMIT:.bootstrap/source.part${n}.b64" > "/tmp/fmi-v3-parts/source.part${n}.b64"
          done
          python3 - <<'PY'
          import base64, pathlib
          parts = [pathlib.Path(f'/tmp/fmi-v3-parts/source.part{i:02d}.b64').read_bytes() for i in range(5)]
          # The original verified transfer lost exactly one byte in part03.
          if len(parts[3]) == 8999:
              parts[3] = parts[3][:2408] + b'n' + parts[3][2408:]
          pathlib.Path('source.zip').write_bytes(base64.b64decode(b''.join(parts), validate=True))
          PY
          echo "a98699a516c7f07cc553075d40d595691cced918c4cf71b90c53d8c450dd119c  source.zip" | shasum -a 256 -c -
          unzip -q source.zip
          test -f findmyink-collector/package.json

      - name: Apply V3.2 recovery hotfix
        shell: bash
        run: |
          python3 .hotfix/patch_v32.py
          grep -q '"version": "0.3.2"' findmyink-collector/package.json
          node --check findmyink-collector/main/services/browserCollector.js
          node --check findmyink-collector/main/services/collectorEngine.js
          node --check findmyink-collector/main/index.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: findmyink-collector
        run: npm install

      - name: Run tests
        working-directory: findmyink-collector
        run: npm test

      - name: Build DMG Apple Silicon
        working-directory: findmyink-collector
        run: npx electron-builder --mac dmg --arm64

      - name: Verify DMG
        working-directory: findmyink-collector
        shell: bash
        run: |
          ls -lah release
          DMG="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$DMG"
          shasum -a 256 "$DMG"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: FindMyInk-Collector-V3.2-macOS-Apple-Silicon
          path: findmyink-collector/release/*.dmg
          if-no-files-found: error
          compression-level: 0
