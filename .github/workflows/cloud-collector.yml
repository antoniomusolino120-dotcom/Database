name: Database Cloud Scraper

on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'Browser paralleli'
        required: true
        default: '3'
        type: choice
        options: ['3','5']
      max_minutes:
        description: 'Durata massima per worker (max 330)'
        required: true
        default: '300'
        type: string
      max_municipalities_per_worker:
        description: '0 = coda completa, 1 = smoke test'
        required: true
        default: '0'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloud-collector.yml'

permissions:
  contents: read

concurrency:
  group: database-cloud-scraper
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      SHEET_ENDPOINT: ${{ secrets.SHEET_ENDPOINT }}
    steps:
      - name: Probe Apps Script bridge
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SHEET_ENDPOINT" || (echo 'Missing repository secret SHEET_ENDPOINT' && exit 1)
          response=$(curl --fail-with-body --silent --show-error --location --max-time 60 \
            -H 'Content-Type: text/plain;charset=utf-8' \
            --data-binary '{"action":"ping"}' \
            "$SHEET_ENDPOINT")
          RESPONSE="$response" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['RESPONSE'])
          if not data.get('ok'):
              raise SystemExit(data)
          print('Apps Script bridge OK:', data.get('title'), data.get('spreadsheetId'))
          PY

  matrix:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.matrix.outputs.workers }}
    steps:
      - id: matrix
        shell: bash
        run: |
          if [ "${{ inputs.workers }}" = "5" ]; then
            echo 'workers={"worker":[0,1,2,3,4]}' >> "$GITHUB_OUTPUT"
          else
            echo 'workers={"worker":[0,1,2]}' >> "$GITHUB_OUTPUT"
          fi

  init:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: matrix
    runs-on: ubuntu-latest
    env:
      SHEET_ENDPOINT: ${{ secrets.SHEET_ENDPOINT }}
      RUN_ID: ${{ github.run_id }}
      WORKER_COUNT: ${{ inputs.workers }}
    steps:
      - name: Start central queue
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SHEET_ENDPOINT" || (echo 'Missing repository secret SHEET_ENDPOINT' && exit 1)
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({"action":"startCloudRun","runId":os.environ["RUN_ID"],"workerCount":int(os.environ["WORKER_COUNT"])}))
          PY
          )
          response=$(curl --fail-with-body --silent --show-error --location --max-time 60 \
            -H 'Content-Type: text/plain;charset=utf-8' \
            --data-binary "$payload" \
            "$SHEET_ENDPOINT")
          RESPONSE="$response" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['RESPONSE'])
          if not data.get('ok'):
              raise SystemExit(data)
          print(data)
          PY

  worker:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [matrix, init]
    timeout-minutes: 355
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.workers) }}
    env:
      SHEET_ENDPOINT: ${{ secrets.SHEET_ENDPOINT }}
      RUN_ID: ${{ github.run_id }}
      WORKER_INDEX: ${{ matrix.worker }}
      WORKER_COUNT: ${{ inputs.workers }}
      MAX_MINUTES: ${{ inputs.max_minutes }}
      MAX_MUNICIPALITIES_PER_WORKER: ${{ inputs.max_municipalities_per_worker }}
      LEASE_SECONDS: '900'
      PREVIEW_INTERVAL_MS: '25000'
      OUTPUT_PATH: cloud-output/worker-${{ matrix.worker }}.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Sheet bridge
        shell: bash
        run: test -n "$SHEET_ENDPOINT" || (echo 'Missing repository secret SHEET_ENDPOINT' && exit 1)

      - name: Reconstruct verified V3.2 engine
        shell: bash
        run: |
          BASE_COMMIT="edc8c985e9e2f6e9bc205e24889ff2169dd696cd"
          git fetch --depth=1 origin "$BASE_COMMIT"
          mkdir -p /tmp/fmi-v3-parts
          for n in 00 01 02 03 04; do
            git show "$BASE_COMMIT:.bootstrap/source.part${n}.b64" > "/tmp/fmi-v3-parts/source.part${n}.b64"
          done
          python3 - <<'PY'
          import base64, pathlib
          parts=[pathlib.Path(f'/tmp/fmi-v3-parts/source.part{i:02d}.b64').read_bytes() for i in range(5)]
          if len(parts[3]) == 8999:
              parts[3] = parts[3][:2408] + b'n' + parts[3][2408:]
          pathlib.Path('source.zip').write_bytes(base64.b64decode(b''.join(parts), validate=True))
          PY
          echo "a98699a516c7f07cc553075d40d595691cced918c4cf71b90c53d8c450dd119c  source.zip" | sha256sum -c -
          unzip -q source.zip
          python3 .hotfix/patch_v32.py
          cp -R cloud findmyink-collector/cloud

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Electron dependencies
        working-directory: findmyink-collector
        run: npm install

      - name: Run tests
        working-directory: findmyink-collector
        run: npm test

      - name: Run dynamic cloud worker
        working-directory: findmyink-collector
        shell: bash
        run: xvfb-run -a npx electron cloud/worker.mjs

      - name: Upload worker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-worker-${{ matrix.worker }}
          path: findmyink-collector/cloud-output/worker-${{ matrix.worker }}.json
          if-no-files-found: warn
          retention-days: 1

  close:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.init.result == 'success' }}
    needs: [matrix, init, worker]
    runs-on: ubuntu-latest
    env:
      SHEET_ENDPOINT: ${{ secrets.SHEET_ENDPOINT }}
      RUN_ID: ${{ github.run_id }}
      WORKFLOW_RESULT: ${{ needs.worker.result }}
    steps:
      - name: Close run state
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({"action":"closeCloudRun","runId":os.environ["RUN_ID"],"workflowResult":os.environ.get("WORKFLOW_RESULT","")}))
          PY
          )
          response=$(curl --fail-with-body --silent --show-error --location --max-time 60 \
            -H 'Content-Type: text/plain;charset=utf-8' \
            --data-binary "$payload" \
            "$SHEET_ENDPOINT")
          RESPONSE="$response" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['RESPONSE'])
          if not data.get('ok'):
              raise SystemExit(data)
          print(data)
          PY
