<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Database Cloud Console</title>
<style>
:root{--bg:#0b0b0d;--panel:#141418;--panel2:#1a1a20;--line:#2b2b33;--text:#f5f5f6;--muted:#9797a3;--orange:#ff5000;--green:#34c759;--yellow:#ffcc00;--red:#ff453a;--blue:#64d2ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1540px;margin:0 auto;padding:24px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.dot{width:14px;height:14px;border-radius:50%;background:var(--orange);box-shadow:0 0 20px rgba(255,80,0,.55)}h1{font-size:22px;margin:0}.sub,.muted{color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;align-items:center}.timerbox{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px;min-width:178px;text-align:right}.timerbox span{display:block;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}.timerbox b{display:block;font-variant-numeric:tabular-nums;font-size:20px;margin-top:2px}.timerbox em{display:block;font-style:normal;font-size:9px;color:var(--muted);margin-top:1px}.timerbox.closing b,.timerbox.closing em{color:#ffd45e}.timerbox.paused b{color:var(--blue)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer;font-size:13px}.btn:hover:not(:disabled){filter:brightness(1.13)}.btn:disabled{opacity:.38;cursor:not-allowed}.btn.primary{background:var(--orange);border-color:var(--orange);color:white;min-width:120px}.btn.warn{border-color:#665500;color:#ffe166}.btn.danger{border-color:#5a2020;color:#ff8d86}.controls{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:end;gap:18px;flex-wrap:wrap;margin-bottom:12px}.control-group{display:grid;gap:7px}.label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800}.segments{display:flex;gap:6px}.seg{border:1px solid var(--line);background:#101014;color:#c8c8d0;padding:9px 11px;border-radius:9px;font-size:12px;font-weight:800;cursor:pointer}.seg.active{border-color:var(--orange);color:white;background:rgba(255,80,0,.15)}.launch-state{margin-left:auto;min-width:300px}.launch-state b{display:block;font-size:12px}.token-ok{color:#75e18e}.token-bad{color:#ff8c86}.statusline{font-size:12px;color:var(--muted);margin:8px 0 12px}.summary{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:10px;margin-bottom:14px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.metric b{display:block;font-size:22px;margin-top:5px}.metric span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.progress{height:8px;background:#222229;border-radius:99px;overflow:hidden;margin:8px 0 18px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--orange),#ff8a4c);transition:width .4s}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.worker{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}.worker.off{opacity:.42}.worker.stalled{border-color:#6b302c}.worker.ready{border-color:#284d62}.worker-head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:1px solid var(--line)}.worker-title{font-weight:800}.badge{font-size:10px;font-weight:900;padding:5px 8px;border-radius:999px;background:#2a2a31;color:#cfcfd6}.badge.WORKING{background:rgba(52,199,89,.13);color:#75e18e}.badge.IDLE,.badge.QUEUED{background:rgba(255,204,0,.12);color:#ffe166}.badge.PAUSING,.badge.CLOSING,.badge.STOPPING{background:rgba(255,204,0,.12);color:#ffe166}.badge.READY{background:rgba(100,210,255,.12);color:#8bddff}.badge.DONE{background:rgba(151,151,163,.16);color:#d1d1d7}.badge.STALLED,.badge.ERROR{background:rgba(255,69,58,.13);color:#ff938d}.preview{aspect-ratio:16/9;background:#09090b;display:grid;place-items:center;position:relative;overflow:hidden}.preview img{width:100%;height:100%;object-fit:cover;display:block}.placeholder{color:#54545f;font-size:12px}.preview-meta{position:absolute;right:8px;bottom:8px;display:flex;gap:5px}.preview-time,.preview-countdown{background:rgba(0,0,0,.78);padding:4px 6px;border-radius:6px;font-size:10px;color:#ddd}.preview-countdown.ok{color:#9af0ad}.preview-countdown.late{color:#ffd45e}.preview-countdown.stale{color:#ff938d}.body{padding:13px 14px}.municipality{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.phase{font-size:12px;color:var(--orange);font-weight:800;margin-top:4px;min-height:17px}.query{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:17px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.s{padding:8px;border:1px solid var(--line);border-radius:9px;background:#111115}.s span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.s b{font-size:13px}.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:10px}.worker-actions{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}.mini{border:1px solid var(--line);background:#101014;color:#d6d6dc;border-radius:8px;padding:7px 9px;font-size:10px;font-weight:900;cursor:pointer}.mini:hover:not(:disabled){filter:brightness(1.18)}.mini:disabled{opacity:.35;cursor:not-allowed}.mini.pause{color:#ffe166}.mini.stop{color:#ff938d}.mini.restart{color:#8bddff;border-color:#284d62}.log{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.log h2{font-size:13px;margin:0 0 10px}.rows{display:grid;gap:7px;max-height:420px;overflow:auto}.row{display:grid;grid-template-columns:70px 85px 145px 1fr;gap:8px;font-size:11px;padding:7px 8px;background:#101014;border-radius:8px}.row .time,.row .who{color:var(--muted)}.row .eventphase{color:var(--orange);font-weight:800}.error{color:#ff938d}@media(max-width:1180px){.summary{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.wrap{padding:14px}.top{align-items:flex-start;flex-direction:column}.top-actions{width:100%;flex-wrap:wrap}.timerbox{flex:1;text-align:left}.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.controls{align-items:stretch}.launch-state{margin-left:0;min-width:100%}.segments{flex-wrap:wrap}.btn.primary{flex:1}.row{grid-template-columns:58px 72px 1fr}.row .eventphase{grid-column:3}.row .eventmsg{grid-column:1/4;padding-left:130px}}
</style></head>
<body><div class="wrap">
<div class="top"><div class="brand"><div class="dot"></div><div><h1>Database Cloud Console</h1><div class="sub" id="runline">Nessun run attivo</div></div></div><div class="top-actions"><div class="timerbox" id="timerbox"><span>Timer run</span><b id="runTimer">—</b><em id="timerState">In attesa</em></div><button class="btn warn" id="pauseBtn" onclick="pauseRun()">PAUSA</button><button class="btn danger" id="stopBtn" onclick="stopRun()">STOP</button></div></div>
<div class="controls">
  <div class="control-group"><div class="label">Chromium</div><div class="segments"><button class="seg" id="w5" onclick="setWorkers(5)">5 worker</button><button class="seg active" id="w10" onclick="setWorkers(10)">10 worker</button></div></div>
  <div class="control-group"><div class="label">Modalità</div><div class="segments"><button class="seg" id="modeTest" onclick="setMode('test')">TEST · 1 comune / worker</button><button class="seg active" id="modeFull" onclick="setMode('full')">COMPLETA · tutta la coda</button></div></div>
  <button class="btn primary" id="startBtn" onclick="startRun()">AVVIA</button>
  <div class="launch-state"><b id="tokenState">Controllo token GitHub…</b><span class="muted" id="launchState">La console avvia direttamente GitHub Actions.</span></div>
</div>
<div class="statusline" id="statusline">Connessione al Google Sheet…</div>
<div class="summary"><div class="metric"><span>Completati</span><b id="m-completed">—</b></div><div class="metric"><span>TODO</span><b id="m-todo">—</b></div><div class="metric"><span>Trovati</span><b id="m-found">—</b></div><div class="metric"><span>Nuovi</span><b id="m-new">—</b></div><div class="metric"><span>Duplicati</span><b id="m-dupes">—</b></div><div class="metric"><span>Scartati</span><b id="m-foreign">—</b></div><div class="metric"><span>Errori</span><b id="m-errors">—</b></div></div>
<div class="progress"><div id="bar"></div></div><div class="grid" id="workers"></div><div class="log"><h2>Attività worker</h2><div class="rows" id="activity"></div></div>
</div>
<script>
const PREVIEW_SECONDS=60,previewTimes={},previewImages={};let lastWorkers=[],selectedWorkers=10,selectedMode='full',githubConfigured=false,currentRun={},readyForStart=false,lastPending=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function fmt(n){return Number(n||0).toLocaleString('it-IT')}
function time(v){if(!v)return'—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function setWorkers(n){selectedWorkers=n;document.getElementById('w5').classList.toggle('active',n===5);document.getElementById('w10').classList.toggle('active',n===10)}
function setMode(m){selectedMode=m;document.getElementById('modeTest').classList.toggle('active',m==='test');document.getElementById('modeFull').classList.toggle('active',m==='full')}
function activeStatus(run){return ['RUNNING','PAUSING','STOPPING','CLOSING','WORKERS_DONE'].includes(String(run&&run.status||''))}
function terminalWorker(st){return ['DONE','READY','OFFLINE'].includes(String(st||''))}
function formatDuration(ms){const total=Math.max(0,Math.floor(ms/1000)),h=Math.floor(total/3600),m=Math.floor((total%3600)/60),s=total%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
function tickRunTimer(){const box=document.getElementById('timerbox'),timer=document.getElementById('runTimer'),label=document.getElementById('timerState'),run=currentRun||{};box.className='timerbox';if(!run.runId||!run.startedAt){timer.textContent='—';label.textContent='In attesa';return;}const deadline=Date.parse(run.deadlineAt||'')||(Date.parse(run.startedAt)+Number(run.maxMinutes||300)*60000),status=String(run.uiStatus||run.status||'');if(['PAUSED'].includes(String(run.status||''))){timer.textContent=formatDuration(Math.max(0,deadline-Date.parse(run.finishedAt||run.updatedAt||new Date())));label.textContent='IN PAUSA · PRONTO';box.classList.add('paused');return;}if(['STOPPED','INCOMPLETE','COMPLETED','COMPLETED_WITH_ERRORS'].includes(String(run.status||''))){timer.textContent='00:00:00';label.textContent='Run terminato';return;}const remaining=deadline-Date.now();timer.textContent=formatDuration(remaining);if(remaining<=0||['CLOSING','STOPPING','PAUSING','WORKERS_DONE'].includes(status)){box.classList.add('closing');label.textContent=status==='PAUSING'?'PAUSA · CHIUSURA IN CORSO':status==='STOPPING'?'STOP · CHIUSURA IN CORSO':'CHIUSURA IN CORSO';}else label.textContent='Tempo residuo';}
function countdownText(w){const i=Number(w.workerIndex||0),at=previewTimes[i];if(!at)return{text:'attendo screenshot',cls:'late'};if(!['WORKING','IDLE','PAUSING','CLOSING'].includes(String(w.status||'')))return{text:'preview ferma',cls:'ok'};const age=Math.max(0,Math.floor((Date.now()-new Date(at).getTime())/1000)),remaining=PREVIEW_SECONDS-age;if(remaining>=0)return{text:`nuovo screenshot tra ~${remaining}s`,cls:'ok'};const late=Math.abs(remaining);if(late<=30)return{text:`preview in ritardo +${late}s`,cls:'late'};return{text:`preview ferma +${late}s`,cls:'stale'};}
function tickCountdowns(){for(const w of lastWorkers){const i=Number(w.workerIndex||0),el=document.getElementById('preview-countdown-'+i);if(!el)continue;const c=countdownText(w);el.textContent=c.text;el.className='preview-countdown '+c.cls;}tickRunTimer();}
function workerControls(w,run){const i=Number(w.workerIndex||0),st=String(w.status||''),same=String(w.runId||'')===String(run.runId||''),runRunning=String(run.status||'')==='RUNNING',deadline=Date.parse(run.deadlineAt||'')||0,canRestart=same&&runRunning&&(!deadline||Date.now()<deadline)&&(st==='STALLED'||st==='READY'||(st==='DONE'&&(w.lastError||String(w.phase||'').includes('ARRESTATO'))));const canControl=same&&!terminalWorker(st)&&['RUNNING'].includes(String(run.status||''));const canRetire=same&&st==='STALLED';return `<div class="worker-actions"><button class="mini pause" ${canControl?'':'disabled'} onclick="workerPause(${i})">PAUSA</button><button class="mini stop" ${(canControl||canRetire)?'':'disabled'} onclick="workerStop(${i})">STOP</button><button class="mini restart" ${canRestart?'':'disabled'} onclick="workerRestart(${i})">RILANCIA</button></div>`;}
function activityRows(workers,run){const events=[];for(const w of workers){if(String(w.runId||'')!==String(run.runId||''))continue;for(const e of (Array.isArray(w.events)?w.events:[]))events.push({at:e.at,worker:Number(w.workerIndex)+1,phase:e.phase||'',message:e.message||''});if(w.lastError)events.push({at:w.lastSeen,worker:Number(w.workerIndex)+1,phase:'ERRORE',message:w.lastError});}events.sort((a,b)=>(Date.parse(b.at)||0)-(Date.parse(a.at)||0));return events.slice(0,60).map(e=>`<div class="row"><span class="time">${esc(time(e.at))}</span><span class="who">Worker ${e.worker}</span><span class="eventphase">${esc(e.phase)}</span><span class="eventmsg">${esc(e.message)}</span></div>`).join('')||'<div class="row"><span>—</span><span>—</span><span>—</span><span>Nessuna attività</span></div>';}
function render(data){const run=data.run||{},t=data.totals||{},workers=data.workers||[],pending=data.pendingStart||null,consoleState=data.console||{};currentRun=run;lastWorkers=workers;lastPending=pending;githubConfigured=Boolean(consoleState.githubConfigured);readyForStart=Boolean(consoleState.readyForStart);const shownStatus=run.uiStatus||run.status||'—';document.getElementById('runline').textContent=run.runId?`Run ${run.runId} · ${run.workerCount||0} worker · ${shownStatus}`:'Nessun run attivo';document.getElementById('statusline').textContent=`Google Sheet collegato · ultimo aggiornamento ${time(data.generatedAt)} · refresh 5s`;const token=document.getElementById('tokenState');token.textContent=githubConfigured?'GitHub pronto':'GITHUB_TOKEN mancante';token.className=githubConfigured?'token-ok':'token-bad';const launch=document.getElementById('launchState'),blocking=Array.isArray(consoleState.blockingWorkers)?consoleState.blockingWorkers:[];if(pending&&pending.requestedAt&&!run.runId)launch.textContent=`Avvio richiesto alle ${time(pending.requestedAt)} · ${pending.workerCount} worker`;else if(activeStatus(run))launch.textContent=`Scraper ${shownStatus} · AVVIA bloccato finché tutti i worker non sono pronti`;else if(!readyForStart&&blocking.length)launch.textContent=`Attendo chiusura: Worker ${blocking.map(i=>Number(i)+1).join(', ')}`;else launch.textContent='Sistema pronto per un nuovo avvio.';const hasPending=Boolean(pending&&pending.requestedAt&&(!run.runId||!activeStatus(run)));document.getElementById('startBtn').disabled=!githubConfigured||!readyForStart||hasPending;document.getElementById('pauseBtn').disabled=String(run.status||'')!=='RUNNING';document.getElementById('stopBtn').disabled=!['RUNNING','PAUSING'].includes(String(run.status||''));document.getElementById('m-completed').textContent=`${fmt(t.completed)} / ${fmt(t.total)}`;document.getElementById('m-todo').textContent=fmt(t.todo);document.getElementById('m-found').textContent=fmt(t.found);document.getElementById('m-new').textContent=fmt(t.newCount);document.getElementById('m-dupes').textContent=fmt(t.duplicates);document.getElementById('m-foreign').textContent=fmt(t.foreign);document.getElementById('m-errors').textContent=fmt(t.errors);document.getElementById('bar').style.width=(t.total?Math.min(100,(t.completed/t.total)*100):0)+'%';for(const w of workers){const i=Number(w.workerIndex||0);if(w.previewAt){previewTimes[i]=w.previewAt;if(w.previewBase64)previewImages[i]='data:image/jpeg;base64,'+w.previewBase64;}}document.getElementById('workers').innerHTML=workers.map(w=>{const i=Number(w.workerIndex||0),st=String(w.status||'OFFLINE'),active=i<Number(run.workerCount||0)&&String(w.runId||'')===String(run.runId||''),img=previewImages[i]?`<img src="${previewImages[i]}" alt="Preview Chromium worker ${i+1}">`:`<div class="placeholder">Preview Chromium non ancora disponibile</div>`,c=countdownText(w),extra=st==='STALLED'?'stalled':st==='READY'?'ready':'';return`<section class="worker ${active?'':'off'} ${extra}"><div class="worker-head"><div class="worker-title">Worker ${i+1}</div><span class="badge ${esc(st)}">${esc(st)}</span></div><div class="preview">${img}<div class="preview-meta"><span class="preview-time">${esc(time(w.previewAt))}</span><span id="preview-countdown-${i}" class="preview-countdown ${c.cls}">${esc(c.text)}</span></div></div><div class="body"><div class="municipality">${esc(w.municipalityName||'—')}</div><div class="phase">${esc(w.phase||st)}</div><div class="query">${esc(w.query||'')}</div><div class="stats"><div class="s"><span>Trovati</span><b>${fmt(w.found||0)}</b></div><div class="s"><span>Nuovi</span><b>${fmt(w.newCount||0)}</b></div><div class="s"><span>Dup.</span><b>${fmt(w.duplicates||0)}</b></div><div class="s"><span>Comuni</span><b>${fmt(w.completedMunicipalities||0)}</b></div></div><div class="foot"><span>${esc(w.queueCode||'')}</span><span>ping ${esc(time(w.lastSeen))} · g${fmt(w.generation||1)}</span></div>${workerControls(w,run)}</div></section>`}).join('');document.getElementById('activity').innerHTML=activityRows(workers,run);tickCountdowns();}
function refresh(force=false){if(force)document.getElementById('statusline').textContent='Aggiornamento…';google.script.run.withSuccessHandler(render).withFailureHandler(err=>{document.getElementById('statusline').textContent='Errore dashboard: '+(err&&err.message?err.message:err)}).getCloudDashboardState(previewTimes)}
function startRun(){const limit=selectedMode==='test'?1:0;if(!githubConfigured||!readyForStart)return;const msg=selectedMode==='test'?`Avviare ${selectedWorkers} Chromium, 1 comune ciascuno?`:`Avviare ${selectedWorkers} Chromium per massimo 5 ore sulla coda completa?`;if(!confirm(msg))return;const b=document.getElementById('startBtn');b.disabled=true;document.getElementById('launchState').textContent='Invio comando a GitHub…';google.script.run.withSuccessHandler(()=>{document.getElementById('launchState').textContent='Avvio accettato. Attendo i worker…';setTimeout(()=>refresh(true),1800)}).withFailureHandler(err=>{document.getElementById('launchState').textContent='Errore avvio: '+(err&&err.message?err.message:err);refresh(true)}).startCloudCollector(selectedWorkers,limit,300)}
function pauseRun(){if(!confirm('Mettere in pausa il run? Ogni worker termina in sicurezza il comune corrente e poi chiude.'))return;document.getElementById('pauseBtn').disabled=true;google.script.run.withSuccessHandler(()=>refresh(true)).withFailureHandler(err=>{alert(err&&err.message?err.message:err);refresh(true)}).requestCloudPause()}
function stopRun(){if(!confirm('Fermare il run? I worker interromperanno in sicurezza e nessun nuovo avvio sarà possibile finché le card non saranno pronte.'))return;document.getElementById('stopBtn').disabled=true;google.script.run.withSuccessHandler(()=>refresh(true)).withFailureHandler(err=>{alert(err&&err.message?err.message:err);refresh(true)}).requestCloudStop()}
function workerPause(i){if(!confirm(`Mettere in pausa Worker ${i+1}? Terminerà il comune corrente e diventerà rilanciabile.`))return;google.script.run.withSuccessHandler(()=>refresh(true)).withFailureHandler(err=>{alert(err&&err.message?err.message:err);refresh(true)}).requestCloudWorkerPause(i)}
function workerStop(i){if(!confirm(`Fermare Worker ${i+1}?`))return;google.script.run.withSuccessHandler(()=>refresh(true)).withFailureHandler(err=>{alert(err&&err.message?err.message:err);refresh(true)}).requestCloudWorkerStop(i)}
function workerRestart(i){if(!confirm(`Rilanciare solo Worker ${i+1}? Gli altri continueranno senza interruzioni.`))return;google.script.run.withSuccessHandler(()=>refresh(true)).withFailureHandler(err=>{alert(err&&err.message?err.message:err);refresh(true)}).restartCloudWorker(i)}
setWorkers(10);setMode('full');refresh(true);setInterval(()=>refresh(false),5000);setInterval(tickCountdowns,1000);
</script></body></html>
